[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-cache-system"
version = "0.1.0"
description = "Benchmarkable adaptive cache eviction policies"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    "redis>=5.0,<7.0",
    "streamlit>=1.30,<2.0",
    "requests>=2.31,<3.0",
    "pandas>=2.0,<4.0",
]

[tool.setuptools.packages.find]
include = ["backend*"]
